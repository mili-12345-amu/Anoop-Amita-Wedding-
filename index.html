<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anoop ❤️ Amita Wedding</title><!-- Google Fonts --><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{
  --pink:#f8d7da;
  --lavender:#e6d7ff;
  --peach:#ffe5d9;
  --gold:#d4af37;
  --white:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(to bottom,var(--pink),var(--lavender));
  color:#333;
  scroll-behavior:smooth;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(255,255,255,0.5),rgba(255,255,255,0.5)),
  url('https://images.unsplash.com/photo-1522673607200-164d1b6ce486') center/cover;
}

.hero h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:#b76e79;
}

.hero p{margin-top:10px;font-size:1.2rem;}

.glass{
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:30px;
  box-shadow:0 8px 32px rgba(0,0,0,0.1);
}

/* SECTION */
section{padding:60px 20px;text-align:center;}
h2{
  font-family:'Playfair Display',serif;
  margin-bottom:20px;
  color:#b76e79;
}

/* CARDS */
.card{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
  margin:10px;
  transition:0.3s;
}
.card:hover{transform:translateY(-5px);}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

/* COUNTDOWN */
#countdown{
  font-size:1.5rem;
  margin-top:10px;
}

/* RSVP */
input,select,textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:var(--gold);
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
}

/* FLOATING HEARTS */
.heart{
  position:fixed;
  bottom:-20px;
  color:#ff6b81;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(0);}
  100%{transform:translateY(-100vh);}
}

/* SCRATCH CARD */
canvas{
  border-radius:20px;
  background:#ccc;
}

/* RESPONSIVE */
@media(max-width:768px){
  .hero h1{font-size:2rem;}
