<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
body{
font-family:sans-serif;
text-align:center;
background:#fff5f8;
}

section{
padding:40px;
}

.card{
background:white;
margin:15px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #0002;
}

img{
width:100%;
border-radius:15px;
}

audio{display:none;}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<section>
<h1>Anoop ❤️ Amita</h1>
<p>Your presence and blessings will make our celebration special</p>
<p>With Love & Regards<br>Verma Family</p>
</section>

<!-- EVENTS -->
<section>

<div class="card">
<img src="https://images.unsplash.com/photo-1519167758481-83f550bb49b3">
<h3>🎶 Sangeet</h3>
<p>02 February 2027</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1606800052052-a08af7148866">
<h3>🌼 Haldi</h3>
<p>03 February 2027</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a">
<h3>🌿 Mehendi</h3>
<p>03 February 2027</p>
</div>

</section>

<!-- COUNTDOWN -->
<section>
<h2>Countdown</h2>
<div id="countdown"></div>
</section>

<!-- SCRATCH -->
<section>
<h2>Scratch To Reveal</h2>

<canvas id="canvas" width="300" height="150"></canvas>
<div id="reveal" style="display:none;font-size:20px;color:gold;">
💍 04 February 2027 💍
</div>

</section>

<!-- MAP -->
<section>
<h2>Venue</h2>

<iframe
src="https://www.google.com/maps?q=Brahma%20Marriage%20Lawn%20Barabanki&output=embed"
width="100%" height="300">
</iframe>

</section>

<script>

// MUSIC START
document.addEventListener("click", ()=>{
document.getElementById("music").play();
},{once:true});

// COUNTDOWN
let d=new Date("Feb 4 2027").getTime();
setInterval(()=>{
let now=new Date().getTime();
let gap=d-now;

let days=Math.floor(gap/(1000*60*60*24));
document.getElementById("countdown").innerHTML=days+" Days Left";
},1000);

// SCRATCH
let c=document.getElementById("canvas");
let ctx=c.getContext("2d");

ctx.fillStyle="gray";
ctx.fillRect(0,0,300,150);

let draw=false;

c.addEventListener("mousedown",()=>draw=true);
c.addEventListener("mouseup",()=>draw=false);
c.addEventListener("mousemove",(e)=>{
if(!draw)return;
ctx.clearRect(e.offsetX,e.offsetY,20,20);

if(Math.random()>0.7){
c.style.display="none";
document.getElementById("reveal").style.display="block";
}
});

</script>

</body>
</html>
